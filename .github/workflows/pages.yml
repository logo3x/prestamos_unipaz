# Publica la versión de una sola página (carpeta supabase-app/) en GitHub Pages.
# Requiere una vez: Settings › Pages › Source: GitHub Actions.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'supabase-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Preparar solo los archivos públicos
        run: |
          mkdir -p sitio
          cp supabase-app/index.html sitio/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

      - id: despliegue
        uses: actions/deploy-pages@v5
